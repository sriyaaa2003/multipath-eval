[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multipath-eval"
version = "0.1.0"
description = "Evaluation toolkit for multipath routing algorithms: cost, delay, capacity and fault probability on generated and public topologies"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "networkx>=3.2",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
multipath-eval = "multipath_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
